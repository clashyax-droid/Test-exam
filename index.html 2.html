<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT Test Sinov Tizimi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; max-width: 650px; width: 100%; padding: 35px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); }
    h1 { font-size: 24px; color: #1a365d; margin-bottom: 8px; text-align: center; }
    p.subtitle { text-align: center; color: #718096; margin-bottom: 30px; font-size: 14px; }
    .question-block { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .question-title { font-size: 17px; font-weight: 600; margin-bottom: 15px; color: #2b6cb0; }
    .option-label { display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #cbd5e0; padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .option-label:hover { border-color: #3182ce; background-color: #ebf8ff; }
    .option-label input[type="radio"] { width: 18px; height: 18px; accent-color: #3182ce; }
    .submit-btn { width: 100%; background-color: #2b6cb0; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .submit-btn:hover { background-color: #2c5282; }
    .result-box { display: none; text-align: center; padding: 25px 20px; border-radius: 8px; background: #edf2f7; margin-top: 25px; border-top: 4px solid #3182ce; }
    .result-box h2 { font-size: 22px; margin-bottom: 12px; }
    .score { font-size: 32px; font-weight: bold; color: #2b6cb0; margin-bottom: 8px; }
    .result-details { margin-top: 15px; text-align: left; font-size: 15px; line-height: 1.6; }
    .retry-btn { background-color: #718096; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>SAT Sinov Testi</h1>
    <p class="subtitle">Savollarga javob bering va natijangizni bilib oling</p>

    <form id="quizForm">
      <!-- 1-Savol -->
      <div class="question-block">
        <div class="question-title">1-savol: Bu sayt ishlaydimi?</div>
        <label class="option-label"><input type="radio" name="q1" value="Ha" required> Ha</label>
        <label class="option-label"><input type="radio" name="q1" value="Yo'q"> Yo'q</label>
      </div>

      <!-- 2-Savol -->
      <div class="question-block">
        <div class="question-title">2-savol: Test osonmi?</div>
        <label class="option-label"><input type="radio" name="q2" value="Ha" required> Ha</label>
        <label class="option-label"><input type="radio" name="q2" value="Yo'q"> Yo'q</label>
      </div>

      <button type="submit" class="submit-btn">Testni yakunlash</button>
    </form>

    <div id="resultBox" class="result-box">
      <h2>Test natijasi</h2>
      <div class="score" id="scoreText">0 / 2</div>
      <p id="feedbackText" style="color: #4a5568;"></p>
      <div class="result-details" id="resultDetails"></div>
      <button class="retry-btn" onclick="resetQuiz()">Qayta topshirish</button>
    </div>
  </div>

  <script>
    const correctAnswers = { q1: "Ha", q2: "Yo'q" };

    const form = document.getElementById("quizForm");
    const resultBox = document.getElementById("resultBox");
    const scoreText = document.getElementById("scoreText");
    const feedbackText = document.getElementById("feedbackText");
    const resultDetails = document.getElementById("resultDetails");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      let score = 0;
      const totalQuestions = Object.keys(correctAnswers).length;
      const ans1 = form.elements["q1"].value;
      const ans2 = form.elements["q2"].value;

      let detailsHtml = "";

      if (ans1 === correctAnswers.q1) {
        score++;
        detailsHtml += "<p>✅ <b>1-savol:</b> To'g'ri (Ha)</p>";
      } else {
        detailsHtml += "<p>❌ <b>1-savol:</b> Xato (Sizniki: " + ans1 + ", to'g'risi: Ha)</p>";
      }

      if (ans2 === correctAnswers.q2) {
        score++;
        detailsHtml += "<p>✅ <b>2-savol:</b> To'g'ri (Yo'q)</p>";
      } else {
        detailsHtml += "<p>❌ <b>2-savol:</b> Xato (Sizniki: " + ans2 + ", to'g'risi: Yo'q)</p>";
      }

      scoreText.textContent = `${score} / ${totalQuestions}`;
      feedbackText.textContent = (score === totalQuestions) 
        ? "A'lo natija! Barcha javoblar to'g'ri." 
        : (score > 0 ? "Yaxshi natija, lekin xatolar bor." : "Barcha javoblar xato bo'ldi.");

      resultDetails.innerHTML = detailsHtml;
      form.style.display = "none";
      resultBox.style.display = "block";
    });

    function resetQuiz() {
      form.reset();
      form.style.display = "block";
      resultBox.style.display = "none";
    }
  </script>
</body>
</html>
